name: Migration lint

# Runs on every PR + push. Catches the obvious problems before they
# reach staging: duplicate filenames, naming convention drift, empty
# migration files.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migration-lint.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migration-lint.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check filename pattern
        run: |
          # Every migration file must match YYYYMMDDHHMMSS_snake_name.sql
          # Use grep -E rather than find -regex — the latter has BSD vs
          # GNU portability issues with \{n\} quantifiers.
          bad=$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' \
            | grep -Ev '/[0-9]{14}_[a-z0-9_]+\.sql$' || true)
          if [[ -n "$bad" ]]; then
            echo "✗ Migration files with non-conforming names:"
            echo "$bad"
            exit 1
          fi
          echo "✓ All migration filenames conform"

      - name: Check for empty migrations
        run: |
          empty=$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -size -10c || true)
          if [[ -n "$empty" ]]; then
            echo "✗ Empty migration files:"
            echo "$empty"
            exit 1
          fi
          echo "✓ No empty migrations"

      - name: Check for duplicate timestamps
        run: |
          dupes=$(find supabase/migrations -maxdepth 1 -name '*.sql' 2>/dev/null \
            | xargs -n1 basename \
            | awk -F'_' '{print substr($1,1,14)}' \
            | sort | uniq -d)
          if [[ -n "$dupes" ]]; then
            echo "✗ Duplicate migration timestamps:"
            echo "$dupes"
            exit 1
          fi
          echo "✓ No duplicate timestamps"

      - name: Check that new views declare security_invoker
        run: |
          # A view runs as its owner (postgres, BYPASSRLS) unless it says
          # otherwise, and `create or replace view` silently drops the option.
          # 20260910000001 set it on every view that existed; every view written
          # since must carry `security_invoker` on the same statement (the three
          # owner-run mv_ fronts say `= false` on purpose, and that counts).
          bad=""
          for f in supabase/migrations/2026091[0-9]*.sql supabase/migrations/2026[1-9]*.sql supabase/migrations/202[7-9]*.sql; do
            [[ -f "$f" ]] || continue
            [[ "$(basename "$f")" < "20260910000001" ]] && continue
            views=$(grep -Eic '^\s*create\s+(or\s+replace\s+)?view\b' "$f" || true)
            opts=$(grep -Eic 'security_invoker' "$f" || true)
            if (( views > opts )); then bad+="$f ($views views, $opts security_invoker)"$'\n'; fi
          done
          if [[ -n "$bad" ]]; then
            echo "✗ Views without security_invoker:"
            echo "$bad"
            exit 1
          fi
          echo "✓ Every new view says how it runs"
